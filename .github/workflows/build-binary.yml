name: Build binary

on:
  push:
    branches: [main]
    paths:
      - savething.py
  workflow_dispatch:

permissions:
  contents: write

# Run one build at a time, so two quick pushes can't get the same version number
concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: savething.exe
            asset: savething.exe
          # oldest supported runner: a binary built against an older glibc also runs on newer SteamOS
          - os: ubuntu-22.04
            file: savething
            asset: savething-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest -v

      - name: Build binary
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --console --name savething savething.py
          mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need all tags to work out the next version

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Work out next version
        id: ver
        run: |
          max=$(git tag --list 'v*' | sed -n 's/^v\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          version=$(printf 'v%03d' $(( 10#${max:-0} + 1 )))
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$VERSION" dist/savething.exe dist/savething-linux \
            --target "$GITHUB_SHA" \
            --title "Savething $VERSION" \
            --generate-notes
